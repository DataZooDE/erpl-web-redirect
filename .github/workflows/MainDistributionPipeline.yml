#
# Builds, smoke-tests and deploys the erpl_web redirect stub
#

name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main]
    tags: ['**']
    paths-ignore:
      - '**/README.md'
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write # This is required for requesting the JWT
  contents: read  # This is required for actions/checkout

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  # DuckDB 2.0 (pre-release): community-extensions builds repo.ref against this commit
  # (DUCKDB_LATEST_STABLE in its build.yml); keep the SHA in step with it. Build only:
  # no smoke test (no stock 2.0 CLI to download) and no deploy (an alpha binary only
  # loads into that alpha). `make test_redirect` against a local 2.0 build covers it.
  duckdb-next-build:
    name: Build extension binaries (v2.0 pre-release)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: b15358c371daf10dad799a43b6167f6ccdce84d8
      extension_name: erpl_web
      ci_tools_version: v2.0-cyanoptera
      skip_tests: true
      exclude_archs: 'windows_amd64_rtools;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads;'

  duckdb-v155-build:
    name: Build extension binaries (v1.5.6)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.6
      extension_name: erpl_web
      ci_tools_version: v1.5-variegata
      skip_tests: true
      exclude_archs: 'windows_amd64_rtools;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads;'

  duckdb-v155-smoke-test:
    name: Smoke test (v1.5.6)
    needs: duckdb-v155-build
    uses: ./.github/workflows/_extension_smoke_test.yml
    with:
      duckdb_version: v1.5.6
      extension_name: erpl_web
      exclude_archs: 'windows_amd64_rtools;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads;'

  duckdb-v155-deploy:
    name: Deploy extension binaries (v1.5.6)
    needs: [duckdb-v155-build, duckdb-v155-smoke-test]
    uses: ./.github/workflows/_extension_deploy.yml
    secrets: inherit
    with:
      duckdb_version: v1.5.6
      extension_name: erpl_web
      exclude_archs: 'windows_amd64_rtools;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads;'
      deploy_latest: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
      # Versioned paths (<name>/vYYYY.MM.DD/...) come ONLY from the tag run. A main
      # push of the same commit builds before the tag exists (stamp vX-N-gSHA), and its
      # deploy resolves the tag at upload time: if it runs after the tag run it
      # overwrites the release with that pre-tag build (hit duckdb-gdrive v2026.10.17).
      deploy_versioned: ${{ startsWith(github.ref, 'refs/tags/v') }}

  # windows_amd64 is excluded from every v1.4.5 leg, as in erpl-odata: erpl_odata is not
  # published for that combination (its pinned vcpkg commit cannot fetch msys2-runtime), so a
  # stub there would point users at an extension they cannot install.
  duckdb-v145-build:
    name: Build extension binaries (v1.4.5)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.4-andium
    with:
      duckdb_version: v1.4.5
      extension_name: erpl_web
      ci_tools_version: v1.4-andium
      skip_tests: true
      exclude_archs: 'windows_amd64;windows_amd64_rtools;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads;'

  duckdb-v145-smoke-test:
    name: Smoke test (v1.4.5)
    needs: duckdb-v145-build
    uses: ./.github/workflows/_extension_smoke_test.yml
    with:
      duckdb_version: v1.4.5
      extension_name: erpl_web
      exclude_archs: 'windows_amd64;windows_amd64_rtools;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads;'

  duckdb-v145-deploy:
    name: Deploy extension binaries (v1.4.5)
    needs: [duckdb-v145-build, duckdb-v145-smoke-test]
    uses: ./.github/workflows/_extension_deploy.yml
    secrets: inherit
    with:
      duckdb_version: v1.4.5
      extension_name: erpl_web
      exclude_archs: 'windows_amd64;windows_amd64_rtools;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads;'
      deploy_latest: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
      # Versioned paths (<name>/vYYYY.MM.DD/...) come ONLY from the tag run. A main
      # push of the same commit builds before the tag exists (stamp vX-N-gSHA), and its
      # deploy resolves the tag at upload time: if it runs after the tag run it
      # overwrites the release with that pre-tag build (hit duckdb-gdrive v2026.10.17).
      deploy_versioned: ${{ startsWith(github.ref, 'refs/tags/v') }}
